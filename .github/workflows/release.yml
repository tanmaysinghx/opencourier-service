name: Release & Auto-Tag

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Auto-Tag & Publish OpenCourier Executable Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Bump Version and Push Tag
        id: tag_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          create_annotated_tag: true

      - name: Set Release Tag Name
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          elif [ -n "${{ steps.tag_version.outputs.new_tag }}" ]; then
            echo "TAG_NAME=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: opencourier-client/package-lock.json

      - name: Install Angular console dependencies
        working-directory: opencourier-client
        run: npm ci

      - name: Build Angular console
        working-directory: opencourier-client
        run: npm run build

      - name: Build executable JAR with Gradle
        working-directory: opencourier-server
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Generate Checksums
        run: |
          cd opencourier-server/build/libs
          sha256sum opencourier.jar > opencourier.jar.sha256
          echo "SHA256: $(cat opencourier.jar.sha256)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: OpenCourier ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            opencourier-server/build/libs/opencourier.jar
            opencourier-server/build/libs/opencourier.jar.sha256
          body: |
            ## OpenCourier Standalone Executable (${{ env.TAG_NAME }})

            ### Direct Download
            - **[opencourier.jar](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/opencourier.jar)** (Standalone Executable JAR with embedded Angular Console SPA)
            - **[opencourier.jar.sha256](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/opencourier.jar.sha256)**

            ### Quick Start
            ```bash
            # 1. Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/opencourier.jar

            # 2. Run
            java -jar opencourier.jar --httpPort=8081
            ```
