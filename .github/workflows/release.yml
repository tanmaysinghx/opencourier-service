name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish OpenCourier Executable Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: opencourier-client/package-lock.json

      - name: Install Angular console dependencies
        working-directory: opencourier-client
        run: npm ci

      - name: Build Angular console
        working-directory: opencourier-client
        run: npm run build

      - name: Build executable JAR with Gradle
        working-directory: opencourier-server
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      - name: Generate Checksums
        run: |
          cd opencourier-server/build/libs
          sha256sum opencourier.jar > opencourier.jar.sha256
          echo "SHA256: $(cat opencourier.jar.sha256)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: OpenCourier ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            opencourier-server/build/libs/opencourier.jar
            opencourier-server/build/libs/opencourier.jar.sha256
          body: |
            ## OpenCourier Standalone Executable

            ### Direct Download
            - **[opencourier.jar](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/opencourier.jar)** (Standalone Fat JAR, includes Angular Console SPA)
            - **[opencourier.jar.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/opencourier.jar.sha256)**

            ### Quick Start (Java 25+)
            ```bash
            # 1. Download
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/opencourier.jar

            # 2. Run
            java -jar opencourier.jar --httpPort=8081
            ```
