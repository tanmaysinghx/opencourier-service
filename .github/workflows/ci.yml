name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: opencourier-client/package-lock.json

      - name: Install & Build Angular Client
        working-directory: opencourier-client
        run: |
          npm ci
          npm run build

      - name: Build & Test Backend with Gradle
        working-directory: opencourier-server
        run: |
          chmod +x gradlew
          ./gradlew check bootJar
