server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: opencourier-server
  profiles:
    active: default
  datasource:
    url: jdbc:h2:file:~/.opencourier/data/opencourier;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PORTAL_SSO_URL:http://localhost:8080}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

app:
  jwt:
    tenant-claim-name: tenant_id
  rate-limiting:
    enabled: true
    default-rate-per-sec: 500

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

